filter out_filter {
  if net ~ 2.56.206.0/24 then reject;
  else accept;
}

protocol bgp mikrotik {
	description "Router";
	local 172.24.0.19 as 64512;
	neighbor 172.25.0.1 as 64513;
	hold time 90;		# Default is 240
#	password "zebra";	# Password used for MD5 authentication
#
	ipv4 {			# regular IPv4 unicast (1/1)
		import filter { reject; };
		export filter {
			accept;
		};
	};
}

protocol bgp antifilter {
    ipv4 {
        import filter {
		gw = 172.25.220.2;
		#ifname = "br-public";
		#dest = RTD_ROUTER;
  		if net ~ 2.56.206.0/24 then reject;
  		else accept;
	} ;
        export filter { reject; };
    };
    local as 65542;
    neighbor 45.154.73.71 as 65432;
    multihop;
    hold time 240;
}
