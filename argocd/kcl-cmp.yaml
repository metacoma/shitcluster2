apiVersion: v1
kind: ConfigMap
metadata:
  name: kcl-plugin-config
  namespace: argocd
data:
  # Sometimes, the ArgoCD runs the kcl run command twice simultaneously,
  # leading to a race condition in the usage of files inside the
  # KCL_CACHE_PATH and KCL_PKG_PATH directories.
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kcl
    spec:
      version: v1.0
      generate:
        command: ["sh", "-c"]
        args:
          - |
            export KCL_CACHE_PATH=/tmp
            export KCL_PKG_PATH=/tmp
            tempfile=$(mktemp)
            errfile=$(mktemp)
            trap 'rm -f "$tempfile" "$errfile"' EXIT
            if ! kcl run -q -o "$tempfile" 2>"$errfile"; then
              # ошибка KCL — выводим её в stderr (попадёт в логи repo-server)
              cat "$errfile" >&2
              exit 1
            fi
            # ВАЖНО: НЕ игнорировать код выхода vals! Раньше скрипт возвращал
            # код выхода только kcl run, а vals (например, 403 от Vault при
            # истёкшем токене) молча падал с пустым stdout — ArgoCD считал
            # «успех с пустым манифестом» и при allowEmpty:true + prune:true
            # сносил все ресурсы приложения.
            if ! cat "$tempfile" | vals eval -f -; then
              exit 1
            fi
