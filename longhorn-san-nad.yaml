apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: longhorn-san
  namespace: longhorn-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "longhorn-san",
      "type": "macvlan",
      "master": "br-san",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "range": "172.27.0.0/16",
        "range_start": "172.27.1.1",
        "range_end": "172.27.1.254",
        "exclude": [
          "172.27.0.10/32",
          "172.27.0.11/32",
          "172.27.0.15/32"
        ]
      }
    }
