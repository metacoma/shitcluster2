---
- name: Prepare Longhorn nodes
  hosts: kube_node
  gather_facts: false
  become: true
  tasks:
    - name: Install longhorn dependencies
      apt:
        name:
          - grep
          - curl
          - bash
          - util-linux
          - open-iscsi
          - nfs-common
          - dmsetup
          - gawk
        state: present

    - name: Ensure iSCSI services are enabled and started
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - open-iscsi
        - iscsid

    - name: Ensure iscsi_tcp kernel module is loaded
      ansible.builtin.modprobe:
        name: iscsi_tcp
        state: present

- name: Install Whereabouts CNI IPAM plugin and configure Longhorn SAN NAD
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  tasks:
    - name: Install Whereabouts via Helm
      kubernetes.core.helm:
        name: whereabouts
        release_namespace: kube-system
        chart_ref: whereabouts-chart
        chart_repo_url: oci://ghcr.io/k8snetworkplumbingwg
        chart_version: "0.9.4"
        values:
          nameOverride: whereabouts
        wait: true
        create_namespace: false
        atomic: false
        binary_path: "{{ bin_dir | default('/usr/local/bin') }}/helm"

    - name: Ensure longhorn-system namespace exists
      ansible.builtin.shell: kubectl create namespace longhorn-system --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Create longhorn-san NAD for dedicated SAN network
      ansible.builtin.shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: longhorn-san
          namespace: longhorn-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "longhorn-san",
              "type": "macvlan",
              "master": "br-san",
              "mode": "bridge",
              "ipam": {
                "type": "whereabouts",
                "range": "172.27.0.0/16",
                "range_start": "172.27.1.1",
                "range_end": "172.27.1.254",
                "exclude": [
                  "172.27.0.10/32",
                  "172.27.0.11/32",
                  "172.27.0.15/32"
                ]
              }
            }
        EOF
      changed_when: false
