---
- name: Prepare Longhorn nodes
  hosts: kube_node
  gather_facts: false
  become: true
  tasks:
    - name: Install longhorn dependencies
      apt:
        name:
          - grep
          - curl
          - bash
          - util-linux
          - open-iscsi
          - nfs-common
          - dmsetup
          - gawk
        state: present

    - name: Ensure iSCSI services are enabled and started
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - open-iscsi
        - iscsid

    - name: Ensure iscsi_tcp kernel module is loaded
      community.general.modprobe:
        name: iscsi_tcp
        state: present

- name: Install Whereabouts CNI IPAM plugin and configure Longhorn SAN NAD
  hosts: kube_control_plane[0]
  gather_facts: false
  become: true
  vars:
    whereabouts_version: "v0.9.4"
    whereabouts_base_url: "https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/{{ whereabouts_version }}/doc/crds"
  tasks:
    - name: Install Whereabouts CRDs
      ansible.builtin.shell: |
        kubectl apply -f {{ whereabouts_base_url }}/whereabouts.cni.cncf.io_ippools.yaml
        kubectl apply -f {{ whereabouts_base_url }}/whereabouts.cni.cncf.io_overlappingrangeipreservations.yaml
      changed_when: false

    - name: Install Whereabouts DaemonSet, RBAC, and ConfigMap
      ansible.builtin.shell: |
        curl -sL {{ whereabouts_base_url }}/daemonset-install.yaml \
          | sed 's|ghcr.io/k8snetworkplumbingwg/whereabouts:latest|ghcr.io/k8snetworkplumbingwg/whereabouts:{{ whereabouts_version }}|g' \
          | kubectl apply -f -
      changed_when: false

    - name: Install Whereabouts reconciler Deployment
      ansible.builtin.shell: |
        curl -sL {{ whereabouts_base_url }}/reconciler-deployment.yaml \
          | sed 's|ghcr.io/k8snetworkplumbingwg/whereabouts:latest|ghcr.io/k8snetworkplumbingwg/whereabouts:{{ whereabouts_version }}|g' \
          | kubectl apply -f -
      changed_when: false

    - name: Wait for Whereabouts DaemonSet rollout to complete
      ansible.builtin.shell: kubectl rollout status daemonset/whereabouts -n kube-system --timeout=300s
      changed_when: false

    - name: Ensure longhorn-system namespace exists
      ansible.builtin.shell: kubectl create namespace longhorn-system --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Create longhorn-san NAD for dedicated SAN network
      ansible.builtin.shell: |
        kubectl apply -f - <<'EOF'
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: longhorn-san
          namespace: longhorn-system
        spec:
          config: |
            {
              "cniVersion": "0.3.1",
              "name": "longhorn-san",
              "type": "macvlan",
              "master": "br-san",
              "mode": "bridge",
              "ipam": {
                "type": "whereabouts",
                "range": "172.27.0.0/16",
                "range_start": "172.27.1.1",
                "range_end": "172.27.1.254",
                "exclude": [
                  "172.27.0.10/32",
                  "172.27.0.11/32",
                  "172.27.0.15/32"
                ]
              }
            }
        EOF
      changed_when: false
