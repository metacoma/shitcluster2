---
# Playbook: Import sops-encrypted secrets into HashiCorp Vault KV v2
#
# Parameters (pass via -e or group_vars):
#   age_key_file   - Path to age private key file (default: ~/.config/sops/age/keys.txt)
#   sops_file      - Path to the sops-encrypted YAML file
#   vault_addr     - Vault address (e.g. http://172.25.1.4:8200)
#   vault_token    - Vault auth token
#   vault_mount    - KV v2 mount point (default: kv)
#   strip_prefix   - Top-level key to strip from vault paths (default: "")
#
# Usage:
#   ansible-playbook sops_to_vault.yml \
#     -e age_key_file=/path/to/keys.txt \
#     -e sops_file=/path/to/vault_data.sops.yaml \
#     -e vault_addr=http://172.25.1.4:8200 \
#     -e vault_token=hvs.xxx \
#     -e strip_prefix=vault_data
#
# Dependencies:
#   - sops (CLI)
#   - age (CLI)
#   - ansible-core >= 2.14
#   - community.hashi_vault collection
#   - python3-yaml (PyYAML)

- name: Import sops secrets into HashiCorp Vault
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    age_key_file: "{{ lookup('env', 'SOPS_AGE_KEY_FILE') | default('~/.config/sops/age/keys.txt') }}"
    sops_file: "secrets/vault_data.sops.yaml"
    vault_addr: "http://127.0.0.1:8200"
    vault_token: ""
    vault_mount: "kv"
    validate_certs: false
    strip_prefix: ""
    vault_write_count: 0

  tasks:
    # ------------------------------------------------------------------
    # Step 1: Decrypt sops file
    # ------------------------------------------------------------------
    - name: Decrypt sops file
      ansible.builtin.shell: |
        export SOPS_AGE_KEY_FILE="{{ age_key_file | expanduser }}"
        sops --decrypt "{{ sops_file }}"
      register: sops_decrypted
      no_log: true
      changed_when: false

    - name: Parse decrypted YAML
      ansible.builtin.set_fact:
        sops_data: "{{ sops_decrypted.stdout | from_yaml }}"
      no_log: true

    # ------------------------------------------------------------------
    # Step 2: Enable KV v2 secrets engine (idempotent)
    # Uses vault_write to POST to sys/mounts/{path}
    # ------------------------------------------------------------------
    - name: Enable KV v2 secrets engine
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        path: "sys/mounts/{{ vault_mount }}"
        data:
          type: "kv"
          options:
            version: "2"
        validate_certs: "{{ validate_certs }}"
      ignore_errors: true
      no_log: true

    # ------------------------------------------------------------------
    # Step 3: Recursively walk sops tree and write to Vault
    # Uses include_tasks with write_secret.yml for recursion.
    # Each level collects leaf values (non-mapping) and writes them
    # as one Vault KV path. Nested dicts recurse deeper.
    # ------------------------------------------------------------------
    - name: Write secrets to Vault KV v2
      ansible.builtin.include_tasks: write_secret.yml
      loop: "{{ sops_data | dict2items }}"
      loop_control:
        loop_var: _entry
      vars:
        _entry_key: "{{ _entry.key }}"
        _entry_value: "{{ _entry.value }}"
        _current_path: ""
      no_log: true

    # ------------------------------------------------------------------
    # Step 4: Summary
    # ------------------------------------------------------------------
    - name: Display import summary
      ansible.builtin.debug:
        msg: >
          Successfully imported {{ vault_write_count }} secret path(s)
          into {{ vault_addr }}/{{ vault_mount }}/
      changed_when: false
