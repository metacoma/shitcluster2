---
# Recursive task: write sops secret tree to Vault KV v2
#
# Input vars (set by caller):
#   _entry_key    - current section name (e.g. "grafana", "mcmp2")
#   _entry_value  - current section data (dict of leaves or nested dicts)
#   _current_path - accumulated vault path so far (e.g. "mnt_users")
#
# Strategy:
#   - Collect leaf values (non-mapping) → write as one Vault KV path
#   - Collect nested dicts (mapping) → recurse into sub-paths
#   - Mixed dicts: write leaves at current level, recurse into nested children

# ------------------------------------------------------------------
# Build full vault path (with optional strip_prefix support)
# ------------------------------------------------------------------
- name: Build raw vault path
  ansible.builtin.set_fact:
    _raw_path: "{{ (_current_path + '/' + _entry_key) if _current_path | length > 0 else _entry_key }}"

- name: Apply strip_prefix to vault path
  ansible.builtin.set_fact:
    _vault_path: "{{ _raw_path | regex_replace('^' + strip_prefix + '/', '') if strip_prefix | length > 0 else _raw_path }}"

# ------------------------------------------------------------------
# Collect leaf values (non-mapping) and nested dicts (mapping)
# Uses 'is mapping' test with with_dict + combine (pure Ansible)
# ------------------------------------------------------------------
- name: Initialize collectors
  ansible.builtin.set_fact:
    _leaf_dict: {}
    _nested_list: []

- name: Collect leaf values
  ansible.builtin.set_fact:
    _leaf_dict: "{{ _leaf_dict | combine({ item.key: item.value }) }}"
  with_dict: "{{ _entry_value }}"
  when: item.value is not mapping
  no_log: true

- name: Collect nested dicts
  ansible.builtin.set_fact:
    _nested_list: "{{ _nested_list + [(item.key, item.value)] }}"
  with_dict: "{{ _entry_value }}"
  when: item.value is mapping and item.value | length > 0
  no_log: true

# ------------------------------------------------------------------
# Write leaf values at current path (e.g. kv/grafana)
# ------------------------------------------------------------------
- name: "Write leaf secrets to Vault at {{ _vault_path }}"
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_addr }}"
    token: "{{ vault_token }}"
    engine_mount_point: "{{ vault_mount }}"
    path: "{{ _vault_path }}"
    data: "{{ _leaf_dict }}"
    validate_certs: "{{ validate_certs }}"
  when: _leaf_dict | length > 0
  no_log: true

- name: Increment write counter
  ansible.builtin.set_fact:
    vault_write_count: "{{ vault_write_count | int + 1 }}"
  when: _leaf_dict | length > 0

# ------------------------------------------------------------------
# Recurse into nested dicts (e.g. mnt_users.mcmp2 → kv/mnt_users/mcmp2)
#
# CRITICAL: Pre-compute _current_path for each child BEFORE recursion.
# set_fact modifies global state, so vars in the next loop iteration
# would read the modified value. We capture the parent path now.
# ------------------------------------------------------------------
- name: Prepare nested entries with captured parent path
  ansible.builtin.set_fact:
    _nested_with_paths: []

- name: Build nested entries with parent path
  ansible.builtin.set_fact:
    _nested_with_paths: "{{ _nested_with_paths + [[item[0], item[1], _vault_path]] }}"
  loop: "{{ _nested_list }}"
  when: _nested_list | length > 0

- name: Recurse into nested secret sections
  ansible.builtin.include_tasks: write_secret.yml
  loop: "{{ _nested_with_paths }}"
  loop_control:
    loop_var: _nested_entry
  vars:
    _entry_key: "{{ _nested_entry[0] }}"
    _entry_value: "{{ _nested_entry[1] }}"
    _current_path: "{{ _nested_entry[2] }}"
  when: _nested_list | length > 0
  no_log: true
