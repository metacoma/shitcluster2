---
# Playbook: Configure Vault for ArgoCD and create K8s secrets
# (replaces Terraform argocd/terraform/main.tf)
#
# Creates:
#   1. KV v2 mount at 'kv' path (idempotent)
#   2. Test secret at kv/argocd-test
#   3. SOPS/Age keys at kv/sops/gitops
#   4. Vault policy 'argocd-vals' (read everywhere)
#   5. Бесконечный (root) Vault token для vals/AVP
#   6. K8s Secret 'argocd-vault-credentials' (for vals/KCL plugin)
#   7. K8s Secret 'argocd-vault-plugin-credentials' (for AVP plugin)
#
# Usage:
#   ansible-playbook argocd-vault-setup.yml \
#     -e vault_addr=http://172.25.1.4:8200 \
#     -e vault_token=<root-token> \
#     -e vault_k8s_service_addr=http://vault.vault:8200 \
#     -e sops_public_key="age1..." \
#     -e sops_age_secret_key="AGE-SECRET-KEY-..."
#
# Dependencies:
#   - community.hashi_vault collection
#   - kubectl (for K8s secrets)

- name: Setup Vault for ArgoCD and create K8s secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') or 'http://127.0.0.1:8200' }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') or '' }}"
    vault_mount: "kv"
    vault_mount_description: "KV storage for ArgoCD"
    validate_certs: false
    sops_public_key: ""
    sops_age_secret_key: ""
    argocd_token_renewable: false
    vault_k8s_service_addr: "{{ lookup('env', 'VAULT_K8S_SERVICE_ADDR') or 'http://vault.vault:8200' }}"
    argocd_namespace: "{{ lookup('env', 'ARGOCD_NAMESPACE') or 'argocd' }}"

  tasks:
    # ------------------------------------------------------------------
    # Step 1: Enable KV v2 secrets engine (idempotent — ignores if exists)
    # ------------------------------------------------------------------
    - name: Enable KV v2 secrets engine
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        path: "sys/mounts/{{ vault_mount }}"
        data:
          type: "kv"
          description: "{{ vault_mount_description }}"
          options:
            version: "2"
        validate_certs: "{{ validate_certs }}"
      ignore_errors: true
      no_log: true

    # ------------------------------------------------------------------
    # Step 2: Write test secret at kv/argocd-test
    # ------------------------------------------------------------------
    - name: Write test secret
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        engine_mount_point: "{{ vault_mount }}"
        path: "argocd-test"
        data:
          message: "hello-from-vault"
        validate_certs: "{{ validate_certs }}"
      no_log: true

    # ------------------------------------------------------------------
    # Step 3: Write SOPS/Age keys at kv/sops/gitops
    # ------------------------------------------------------------------
    - name: Write SOPS/Age keys
      community.hashi_vault.vault_kv2_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        engine_mount_point: "{{ vault_mount }}"
        path: "sops/gitops"
        data:
          public_key: "{{ sops_public_key }}"
          age_secret_key: "{{ sops_age_secret_key }}"
        validate_certs: "{{ validate_certs }}"
      no_log: true

    # ------------------------------------------------------------------
    # Step 4: Create Vault policy 'argocd-vals'
    # ------------------------------------------------------------------
    - name: Write argocd-vals policy to temp file
      ansible.builtin.copy:
        content: |
          # Read-only access to all paths
          path "*" {
            capabilities = ["read"]
          }

          # KV v2 metadata or list:
          path "kv/metadata/argocd/*" {
            capabilities = ["read", "list"]
          }
        dest: "/tmp/argocd-vals-policy.hcl"
        mode: "0600"
      no_log: true

    - name: Create Vault policy 'argocd-vals'
      community.hashi_vault.vault_write:
        url: "{{ vault_addr }}"
        token: "{{ vault_token }}"
        path: "sys/policy/argocd-vals"
        data:
          policy: "{{ lookup('file', '/tmp/argocd-vals-policy.hcl') }}"
        validate_certs: "{{ validate_certs }}"
      no_log: true

    - name: Remove temp policy file
      ansible.builtin.file:
        path: "/tmp/argocd-vals-policy.hcl"
        state: absent

    # ------------------------------------------------------------------
    # Step 5: Vault token for ArgoCD — бесконечный (root) токен.
    # ВАЖНО (проверено эмпирически на Vault 2.0.3 с дефолтным конфигом):
    #   auth/token/create с ttl=0s / ttl=0 НЕ даёт «бесконечность»:
    #   сервер применяет системный дефолт 768h (32 дня) — даже ttl=87600h
    #   обрезается до 2764800s (max_lease_ttl в конфиге не задан).
    #   Бесконечный TTL (expire_time=nil, ttl=0s) в такой конфигурации
    #   имеет только root-токен. Он уже создан при инициализации Vault,
    #   лежит в секрете vault/vault-bootstrap и передаётся в плейбук
    #   как vault_token — используем его напрямую, дочерний токен
    #   не создаём (альтернатива с сохранением least-privilege:
    #   renewable-токен + cronjob продления, см. план).
    # ------------------------------------------------------------------
    - name: Use root token as ArgoCD Vault token (infinite TTL)
      ansible.builtin.set_fact:
        argocd_vault_token: "{{ vault_token }}"
      no_log: true

    # ------------------------------------------------------------------
    # Step 6: Create K8s Secret 'argocd-vault-credentials'
    # Used by vals/KCL plugin sidecar in argocd-repo-server
    # ------------------------------------------------------------------
    - name: Create argocd-vault-credentials K8s secret
      ansible.builtin.shell: |
        kubectl create secret generic argocd-vault-credentials \
          --from-literal=VAULT_ADDR="{{ vault_k8s_service_addr }}" \
          --from-literal=VAULT_TOKEN="{{ argocd_vault_token }}" \
          -n {{ argocd_namespace }} \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true

    # ------------------------------------------------------------------
    # Step 7: Create K8s Secret 'argocd-vault-plugin-credentials'
    # Used by AVP (argocd-vault-plugin) and KCL/vals plugin sidecars.
    # Replaces the hardcoded vault_secret.yml.
    # ------------------------------------------------------------------
    - name: Create argocd-vault-plugin-credentials K8s secret
      ansible.builtin.shell: |
        kubectl create secret generic argocd-vault-plugin-credentials \
          --from-literal=AVP_TYPE=vault \
          --from-literal=AVP_AUTH_TYPE=token \
          --from-literal=VAULT_ADDR="{{ vault_k8s_service_addr }}" \
          --from-literal=VAULT_TOKEN="{{ argocd_vault_token }}" \
          -n {{ argocd_namespace }} \
          --dry-run=client -o yaml | kubectl apply -f -
      no_log: true

    # ------------------------------------------------------------------
    # Summary
    # ------------------------------------------------------------------
    - name: Display setup summary
      ansible.builtin.debug:
        msg:
          - "Vault KV v2 mount enabled at '{{ vault_mount }}'"
          - "Test secret written to kv/argocd-test"
          - "SOPS/Age keys written to kv/sops/gitops"
          - "Policy 'argocd-vals' created"
          - "Vault token created"
          - "K8s Secret 'argocd-vault-credentials' created in namespace '{{ argocd_namespace }}'"
          - "K8s Secret 'argocd-vault-plugin-credentials' created in namespace '{{ argocd_namespace }}'"
